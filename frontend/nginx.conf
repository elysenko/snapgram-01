server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  # 3001 is the port the API actually binds (backend/src/main.ts defaults to it,
  # and colossus.yaml declares `backend.port: 3001`). Proxying to 3000 here made
  # every /api call a 502 whenever PORT was not explicitly overridden.
  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Post and avatar uploads are capped at 5 MB by multer; nginx's 1 MB default
    # would reject them with a 413 before the API ever saw the request.
    client_max_body_size 8m;
  }
}
