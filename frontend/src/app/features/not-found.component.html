<div class="page page--narrow" data-testid="not-found-page">
  <div class="card card-pad state">
    <span class="notfound__code">404</span>
    <span class="state__title" data-testid="not-found-title">This page does not exist</span>
    <p class="muted">The link may be broken, or the post or profile it pointed at has since been removed.</p>
    <div class="notfound__actions">
      <a class="btn btn--primary" routerLink="/explore" data-testid="not-found-explore">Go to Explore</a>
      <a class="btn btn--ghost" routerLink="/feed" data-testid="not-found-feed">Your feed</a>
    </div>
  </div>
</div>
